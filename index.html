<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Tareas</title>

    <link rel="stylesheet" href="css/estilos.css">

    <!-- Necesario para que el atributo hidden oculte las tarjetas aunque usen flex/grid -->
    <style>
        .tarjeta[hidden] {
            display: none;
        }
    </style>

    <script type="module" src="js/interfaz.js"></script>
</head>

<body>

    <h1>Gestor de tareas</h1>

    <!-- FORMULARIO PARA AÑADIR TAREAS (la referencia se valida con expresión regular) -->
    <form id="formTarea" novalidate>
        <h2>Añadir tarea</h2>

        <label>
            Referencia (ej: TAR-001)
            <input type="text" id="referencia" name="referencia" placeholder="TAR-001">
        </label>

        <label>
            Nombre
            <input type="text" id="nombreTarea" name="nombre" placeholder="Ej: revisar logs">
        </label>

        <label>
            Responsable
            <input type="text" id="responsable" name="responsable" placeholder="Ej: Angel">
        </label>

        <label>
            Categoría
            <select id="categoria" name="categoria">
                <option value="javascript">JavaScript</option>
                <option value="html">HTML</option>
                <option value="php">PHP</option>
                <option value="web">Web</option>
                <option value="ciberseguridad">Ciberseguridad</option>
                <option value="base de datos">Base de datos</option>
                <option value="monitorizacion">Monitorización</option>
            </select>
        </label>

        <label>
            Fecha
            <input type="date" id="fecha" name="fecha">
        </label>

        <label>
            Prioridad
            <select id="prioridad" name="prioridad">
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
            </select>
        </label>

        <label>
            Estado
            <select id="estado" name="estado">
                <option value="pendiente">Pendiente</option>
                <option value="terminada">Terminada</option>
            </select>
        </label>

        <button type="submit">Añadir</button>

        <p id="aviso" class="aviso"></p>
    </form>

    <!-- BUSCADOR (el script lo busca por el id "filtro") -->
    <input
        type="text"
        id="filtro"
        placeholder="Buscar por nombre o responsable..."
    >

    <!-- FILTROS -->
    <select id="filtroPrioridad">
        <option value="">Todas las prioridades</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
    </select>

    <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="terminada">Terminada</option>
    </select>

    <!-- ORDENACIÓN -->
    <div class="controles">

        <button id="ordenNombre">
            Ordenar por nombre (A-Z)
        </button>

        <button id="ordenTiempo">
            Ordenar por tiempo
        </button>

        <button id="ordenFecha">
            Más recientes primero
        </button>

    </div>

    <!-- MENSAJE CUANDO NO HAY RESULTADOS -->
    <p id="mensaje" hidden>No se encontraron tareas.</p>

    <!-- RESUMEN Y ESTADÍSTICAS -->
    <p id="resumen"></p>
    <p id="estadisticas"></p>

    <!-- TARJETAS -->
    <div id="contenedor"></div>

</body>
</html>
